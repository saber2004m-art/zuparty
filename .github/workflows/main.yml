name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          echo "Repo root contents:"
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found at repo root."
            exit 1
          fi
          echo "Using zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find project -name pubspec.yaml -type f | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> $GITHUB_ENV

      - name: Patch known Dart build issues
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - << 'PYEOF'
          import pathlib

          f = pathlib.Path("lib/services/zuparty_backend.dart")
          src = f.read_text()
          changed = False

          if "dart:typed_data" not in src:
              src = src.replace("import 'dart:math';", "import 'dart:math';\nimport 'dart:typed_data';", 1)
              changed = True

          old_search = "    var req = client\n        .from('zp_profiles')\n        .select('id,display_name,avatar_url,gender,level,vip_until,updated_at')\n        .order('updated_at', ascending: false)\n        .limit(50);\n    if (q.isNotEmpty) req = req.ilike('display_name', '%$q%');\n    final rows = await req;"
          new_search = "    final base = client\n        .from('zp_profiles')\n        .select('id,display_name,avatar_url,gender,level,vip_until,updated_at');\n    final filtered = q.isNotEmpty ? base.ilike('display_name', '%$q%') : base;\n    final rows = await filtered.order('updated_at', ascending: false).limit(50);"
          if old_search in src:
              src = src.replace(old_search, new_search, 1)
              changed = True

          old_upload = "    await client.storage.from('avatars').uploadBinary(\n      path,\n      bytes,\n      fileOptions: FileOptions(contentType: 'image/$ext', upsert: true),\n    );"
          new_upload = "    await client.storage.from('avatars').uploadBinary(\n      path,\n      Uint8List.fromList(bytes),\n      fileOptions: FileOptions(contentType: 'image/$ext', upsert: true),\n    );"
          if old_upload in src:
              src = src.replace(old_upload, new_upload, 1)
              changed = True

          if changed:
              f.write_text(src)
              print("Patched lib/services/zuparty_backend.dart.")
          else:
              print("No matching patterns found (file may already be fixed) - left as is.")
          PYEOF

      - name: Fix dependency conflict
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  ffi: ^2.1.0" >> pubspec.yaml

      - name: Fix Android compileSdk
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          cat >> build.gradle << 'GRADLE_EOF'

          subprojects {
              plugins.withId("com.android.application") {
                  android { compileSdkVersion 36 }
              }
              plugins.withId("com.android.library") {
                  android { compileSdkVersion 36 }
              }
          }
          GRADLE_EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Force plugin compileSdk to 36
        run: |
          set -euo pipefail
          find "$PUB_CACHE" -path "*/android/build.gradle" -print0 2>/dev/null | \
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            grep -n "compileSdk" "$f" || true
            sed -i -E 's/^([[:space:]]*)compileSdkVersion[[:space:]].*/\1compileSdkVersion 36/' "$f"
            sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]].*/\1compileSdk 36/' "$f"
          done
          echo "Patched plugin build.gradle files."

      - name: Setup Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.1

      - name: Generate modern Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: gradle wrapper --gradle-version 8.14.1

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
